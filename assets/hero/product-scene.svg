<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 900" preserveAspectRatio="xMidYMid slice" role="img" aria-labelledby="heroTitle heroDesc">
  <title id="heroTitle">Document shelves</title>
  <desc id="heroDesc">Full-bleed teal panel with organized document shelves.</desc>
  <defs>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#c5e8e6"/>
      <stop offset="55%" stop-color="#b7dfdc"/>
      <stop offset="100%" stop-color="#a8d5d4"/>
    </linearGradient>
    <linearGradient id="shelf" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0e5a8a"/>
      <stop offset="100%" stop-color="#1a9b8e"/>
    </linearGradient>
  </defs>

  <!-- Edge-to-edge panel (no rounded card) -->
  <rect width="720" height="900" fill="url(#panel)"/>

  <!-- Shelves centered in panel -->
  <g transform="translate(110 160)">
    <rect x="0" y="70" width="500" height="20" rx="6" fill="url(#shelf)"/>
    <rect x="30" y="10" width="70" height="60" rx="4" fill="#f4fafc"/>
    <rect x="115" y="0" width="80" height="70" rx="4" fill="#e8f7f4"/>
    <rect x="210" y="18" width="60" height="52" rx="4" fill="#f7fafc"/>
    <rect x="290" y="5" width="85" height="65" rx="4" fill="#dff3ee"/>
    <rect x="395" y="22" width="65" height="48" rx="4" fill="#f4fafc"/>

    <rect x="0" y="230" width="500" height="20" rx="6" fill="url(#shelf)"/>
    <rect x="40" y="160" width="75" height="70" rx="4" fill="#e8f7f4"/>
    <rect x="135" y="175" width="60" height="55" rx="4" fill="#f4fafc"/>
    <rect x="215" y="150" width="95" height="80" rx="4" fill="#dff3ee"/>
    <rect x="330" y="168" width="70" height="62" rx="4" fill="#f7fafc"/>
    <rect x="420" y="180" width="55" height="50" rx="4" fill="#e8f3fa"/>

    <rect x="0" y="400" width="500" height="20" rx="6" fill="url(#shelf)"/>
    <rect x="25" y="330" width="70" height="70" rx="4" fill="#cfe9e4"/>
    <rect x="115" y="345" width="55" height="55" rx="4" fill="#f4fafc"/>
    <rect x="190" y="320" width="90" height="80" rx="4" fill="#e8f3fa"/>
    <rect x="300" y="338" width="70" height="62" rx="4" fill="#dff3ee"/>
    <rect x="390" y="350" width="60" height="50" rx="4" fill="#f7fafc"/>
  </g>

  <!-- Foreground open binder -->
  <g transform="translate(200 560)">
    <rect x="0" y="28" width="280" height="200" rx="12" fill="#0e5a8a"/>
    <rect x="22" y="0" width="250" height="200" rx="10" fill="#f7fafc"/>
    <rect x="55" y="36" width="180" height="12" rx="6" fill="#0e5a8a" opacity="0.35"/>
    <rect x="55" y="66" width="145" height="10" rx="5" fill="#1a9b8e" opacity="0.35"/>
    <rect x="55" y="94" width="165" height="10" rx="5" fill="#0e5a8a" opacity="0.2"/>
    <rect x="55" y="122" width="120" height="10" rx="5" fill="#0e5a8a" opacity="0.18"/>
  </g>
</svg>
