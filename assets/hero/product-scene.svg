<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 720" role="img" aria-labelledby="heroTitle heroDesc">
  <title id="heroTitle">Product workspace illustration</title>
  <desc id="heroDesc">Portrait view of organized document shelves and an open binder.</desc>
  <defs>
    <linearGradient id="shelf" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0e5a8a"/>
      <stop offset="100%" stop-color="#1a9b8e"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.92"/>
      <stop offset="100%" stop-color="#d7ebf6" stop-opacity="0.7"/>
    </linearGradient>
    <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#9fd0ea"/>
      <stop offset="55%" stop-color="#c9ebe4"/>
      <stop offset="100%" stop-color="#eef6fb"/>
    </linearGradient>
  </defs>

  <rect width="540" height="720" rx="28" fill="url(#sky)"/>

  <!-- tall window plane -->
  <rect x="70" y="56" width="400" height="520" rx="26" fill="url(#glass)" stroke="#0e5a8a" stroke-opacity="0.16" stroke-width="2"/>
  <rect x="98" y="92" width="344" height="300" rx="16" fill="#b9dff0" opacity="0.5"/>
  <path d="M98 300c44-50 104-78 172-78s128 28 172 78v92H98z" fill="#7fb9d4" opacity="0.32"/>

  <!-- shelves -->
  <g transform="translate(120 130)">
    <rect x="0" y="48" width="280" height="16" rx="6" fill="url(#shelf)"/>
    <rect x="16" y="8" width="40" height="40" rx="4" fill="#f4fafc" stroke="#0a3d5c" stroke-opacity="0.2"/>
    <rect x="66" y="0" width="46" height="48" rx="4" fill="#dff3ee" stroke="#127069" stroke-opacity="0.25"/>
    <rect x="122" y="12" width="36" height="36" rx="4" fill="#e8f3fa" stroke="#0e5a8a" stroke-opacity="0.2"/>
    <rect x="168" y="4" width="50" height="44" rx="4" fill="#f7fafc" stroke="#0a3d5c" stroke-opacity="0.18"/>
    <rect x="228" y="14" width="34" height="34" rx="4" fill="#cfe9e4" stroke="#127069" stroke-opacity="0.22"/>

    <rect x="0" y="168" width="280" height="16" rx="6" fill="url(#shelf)"/>
    <rect x="20" y="118" width="48" height="50" rx="4" fill="#e8f3fa" stroke="#0e5a8a" stroke-opacity="0.2"/>
    <rect x="78" y="128" width="38" height="40" rx="4" fill="#f4fafc" stroke="#0a3d5c" stroke-opacity="0.18"/>
    <rect x="128" y="108" width="56" height="60" rx="4" fill="#dff3ee" stroke="#127069" stroke-opacity="0.25"/>
    <rect x="196" y="124" width="44" height="44" rx="4" fill="#e8f3fa" stroke="#0e5a8a" stroke-opacity="0.2"/>

    <rect x="0" y="288" width="280" height="16" rx="6" fill="url(#shelf)"/>
    <rect x="18" y="238" width="44" height="50" rx="4" fill="#cfe9e4" stroke="#127069" stroke-opacity="0.22"/>
    <rect x="74" y="248" width="36" height="40" rx="4" fill="#f7fafc" stroke="#0a3d5c" stroke-opacity="0.18"/>
    <rect x="122" y="228" width="52" height="60" rx="4" fill="#e8f3fa" stroke="#0e5a8a" stroke-opacity="0.2"/>
    <rect x="186" y="244" width="42" height="44" rx="4" fill="#dff3ee" stroke="#127069" stroke-opacity="0.25"/>
  </g>

  <!-- open binder foreground -->
  <g transform="translate(150 470)">
    <rect x="0" y="24" width="220" height="170" rx="14" fill="#0e5a8a"/>
    <rect x="18" y="0" width="200" height="170" rx="12" fill="#f7fafc" stroke="#0a3d5c" stroke-opacity="0.15"/>
    <rect x="42" y="30" width="150" height="10" rx="5" fill="#0e5a8a" opacity="0.35"/>
    <rect x="42" y="56" width="120" height="8" rx="4" fill="#1a9b8e" opacity="0.35"/>
    <rect x="42" y="80" width="140" height="8" rx="4" fill="#0e5a8a" opacity="0.2"/>
    <rect x="42" y="104" width="100" height="8" rx="4" fill="#0e5a8a" opacity="0.18"/>
  </g>
</svg>
