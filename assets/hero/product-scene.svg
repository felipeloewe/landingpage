<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 720" role="img" aria-labelledby="heroTitle heroDesc">
  <title id="heroTitle">Product workspace illustration</title>
  <desc id="heroDesc">Stylized shelves of organized documents beside a calm workspace window.</desc>
  <defs>
    <linearGradient id="shelf" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0e5a8a"/>
      <stop offset="100%" stop-color="#1a9b8e"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#d7ebf6" stop-opacity="0.65"/>
    </linearGradient>
    <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#9fd0ea"/>
      <stop offset="55%" stop-color="#c9ebe4"/>
      <stop offset="100%" stop-color="#eef6fb"/>
    </linearGradient>
  </defs>

  <rect width="960" height="720" fill="url(#sky)"/>

  <!-- distant window plane -->
  <rect x="430" y="90" width="430" height="500" rx="28" fill="url(#glass)" stroke="#0e5a8a" stroke-opacity="0.18" stroke-width="2"/>
  <rect x="460" y="130" width="370" height="280" rx="16" fill="#b9dff0" opacity="0.55"/>
  <path d="M460 320c48-46 108-70 185-70s137 24 185 70v90H460z" fill="#7fb9d4" opacity="0.35"/>

  <!-- document stacks / shelves -->
  <g transform="translate(90 150)">
    <rect x="0" y="40" width="300" height="18" rx="6" fill="url(#shelf)"/>
    <rect x="18" y="0" width="42" height="40" rx="4" fill="#f4fafc" stroke="#0a3d5c" stroke-opacity="0.2"/>
    <rect x="70" y="-10" width="48" height="50" rx="4" fill="#dff3ee" stroke="#127069" stroke-opacity="0.25"/>
    <rect x="128" y="8" width="38" height="32" rx="4" fill="#e8f3fa" stroke="#0e5a8a" stroke-opacity="0.2"/>
    <rect x="176" y="-4" width="52" height="44" rx="4" fill="#f7fafc" stroke="#0a3d5c" stroke-opacity="0.18"/>
    <rect x="238" y="12" width="36" height="28" rx="4" fill="#cfe9e4" stroke="#127069" stroke-opacity="0.22"/>

    <rect x="0" y="160" width="300" height="18" rx="6" fill="url(#shelf)"/>
    <rect x="24" y="110" width="50" height="50" rx="4" fill="#e8f3fa" stroke="#0e5a8a" stroke-opacity="0.2"/>
    <rect x="86" y="120" width="40" height="40" rx="4" fill="#f4fafc" stroke="#0a3d5c" stroke-opacity="0.18"/>
    <rect x="138" y="100" width="58" height="60" rx="4" fill="#dff3ee" stroke="#127069" stroke-opacity="0.25"/>
    <rect x="208" y="118" width="44" height="42" rx="4" fill="#e8f3fa" stroke="#0e5a8a" stroke-opacity="0.2"/>

    <rect x="0" y="280" width="300" height="18" rx="6" fill="url(#shelf)"/>
    <rect x="20" y="230" width="46" height="50" rx="4" fill="#cfe9e4" stroke="#127069" stroke-opacity="0.22"/>
    <rect x="78" y="242" width="36" height="38" rx="4" fill="#f7fafc" stroke="#0a3d5c" stroke-opacity="0.18"/>
    <rect x="126" y="220" width="54" height="60" rx="4" fill="#e8f3fa" stroke="#0e5a8a" stroke-opacity="0.2"/>
    <rect x="192" y="236" width="42" height="44" rx="4" fill="#dff3ee" stroke="#127069" stroke-opacity="0.25"/>
    <rect x="246" y="246" width="30" height="34" rx="4" fill="#f4fafc" stroke="#0a3d5c" stroke-opacity="0.18"/>
  </g>

  <!-- open binder in foreground -->
  <g transform="translate(360 360)">
    <rect x="0" y="20" width="220" height="160" rx="14" fill="#0e5a8a"/>
    <rect x="18" y="0" width="200" height="160" rx="12" fill="#f7fafc" stroke="#0a3d5c" stroke-opacity="0.15"/>
    <rect x="42" y="28" width="150" height="10" rx="5" fill="#0e5a8a" opacity="0.35"/>
    <rect x="42" y="52" width="120" height="8" rx="4" fill="#1a9b8e" opacity="0.35"/>
    <rect x="42" y="74" width="140" height="8" rx="4" fill="#0e5a8a" opacity="0.2"/>
    <rect x="42" y="96" width="100" height="8" rx="4" fill="#0e5a8a" opacity="0.18"/>
  </g>
</svg>
